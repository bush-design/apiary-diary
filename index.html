<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Queen Cell Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dayjs/1.11.10/dayjs.min.js"></script>
<style>
:root {
  --g:#5C8A4A;--gl:#EEF5EA;--gm:#B8D4A8;--ink:#1a1a1a;--b2:#555;--b3:#999;
  --wht:#FFFFFF;--cr:#F7FAF5;--bdr:#DDE8D6;--red:#DC2626;--amb:#C47E17;
  --r:14px;--rs:8px;--fn:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --nh:52px;--sh:0 1px 3px rgba(0,0,0,.06),0 4px 12px rgba(0,0,0,.04);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--fn);background:#F0F5EE;color:var(--ink);min-height:100vh;}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;height:var(--nh);background:#2C3E28;
  display:flex;align-items:center;padding:0 16px;gap:4px;z-index:200;}
.logo{color:#C8DDB8;font-weight:900;font-size:16px;letter-spacing:-.5px;margin-right:8px;}
nav button{background:none;border:none;color:#8aaa7a;padding:6px 10px;
  border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;
  white-space:nowrap;transition:all .15s;}
nav button.active,nav button:hover{background:rgba(200,221,184,.15);color:#C8DDB8;}
.nsp{flex:1;}
.dot{width:7px;height:7px;border-radius:50%;background:#4b5563;}
.dot.ok{background:#86D47A;} .dot.err{background:#f87171;}

/* MAIN */
main{padding:calc(var(--nh) + 10px) 10px 90px;max-width:680px;margin:0 auto;}

/* CARD */
.card{background:var(--wht);border-radius:var(--r);box-shadow:var(--sh);
  padding:14px;margin-bottom:8px;border:1px solid rgba(0,0,0,.04);}
.chd{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.4px;color:var(--b2);}

/* CHIPS */
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;
  font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.cB{background:#f0edff;color:#5b21b6;} .cS{background:#eff6ff;color:#1d4ed8;}
.cF{background:var(--gl);color:var(--g);}
.cok{background:#dcfce7;color:#166534;} .cwarn{background:#fef9c3;color:#854d0e;}
.cbad{background:#fee2e2;color:#991b1b;}
.cstd{background:var(--gl);color:var(--g);} .caut{background:#fff7ed;color:#c2410c;}

/* FORM */
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:10px;font-weight:700;color:var(--b3);text-transform:uppercase;letter-spacing:.5px;}
input,select,textarea{padding:9px 11px;border:1.5px solid var(--bdr);border-radius:var(--rs);
  font-size:14px;font-family:var(--fn);color:var(--ink);background:var(--cr);
  transition:border-color .15s;outline:none;width:100%;}
input:focus,select:focus,textarea:focus{border-color:var(--g);background:var(--wht);}
textarea{resize:vertical;min-height:56px;}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;}
.lbl{font-size:10px;font-weight:700;color:var(--b3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px;}

/* BTN */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:9px 16px;border-radius:var(--rs);border:none;font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:var(--fn);white-space:nowrap;letter-spacing:.1px;}
.btn:active{transform:scale(.97);}
.bp{background:var(--g);color:var(--wht);} .bp:hover{opacity:.88;}
.bo{background:transparent;border:1.5px solid var(--bdr);color:var(--b2);}
.bo:hover{border-color:var(--g);color:var(--g);}
.bg{background:var(--gl);color:var(--g);} .bg:hover{background:var(--gm);}
.bd{background:#fef2f2;color:var(--red);border:1.5px solid #fecaca;}
.bs{padding:6px 12px;font-size:12px;} .bx{padding:4px 9px;font-size:11px;}
.bb{width:100%;} .badd{background:var(--gl);color:var(--g);border:1.5px dashed var(--gm);}
.brow{display:flex;gap:6px;flex-wrap:wrap;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;}
.stat{background:var(--wht);border-radius:10px;padding:10px 6px;text-align:center;
  box-shadow:var(--sh);border:1px solid rgba(0,0,0,.04);}
.stat .n{font-size:22px;font-weight:800;color:var(--g);line-height:1;}
.stat .l{font-size:9px;color:var(--b3);font-weight:600;text-transform:uppercase;
  letter-spacing:.3px;margin-top:2px;}
.stat input[type=number]::-webkit-inner-spin-button,.stat input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
.stat input[type=number]{-moz-appearance:textfield;}

/* GRAFT CARD — slim */
.gc{border-radius:12px;overflow:hidden;margin-bottom:6px;
  border:1.5px solid var(--bdr);background:var(--wht);}
.gc-hd{padding:10px 12px;display:flex;align-items:flex-start;gap:6px;cursor:pointer;
  background:var(--wht);}
.gc-hd:active{opacity:.85;}
.gc-body{padding:12px;display:none;border-top:1px solid var(--bdr);}
.gc-body.open{display:block;}

/* TIMELINE */
.tl{display:flex;overflow-x:auto;padding:4px 0;scrollbar-width:none;}
.tl::-webkit-scrollbar{display:none;}
.tl-n{display:flex;flex-direction:column;align-items:center;flex:1;min-width:44px;position:relative;}
.tl-n::before{content:'';position:absolute;top:11px;left:50%;right:-50%;height:1.5px;
  background:var(--bdr);z-index:0;}
.tl-n:last-child::before{display:none;}
.tl-d{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:9px;font-weight:800;z-index:1;
  border:2px solid var(--bdr);background:var(--wht);color:var(--b3);}
.tl-d.done{background:var(--g);border-color:var(--g);color:var(--wht);}
.tl-d.now{background:var(--wht);border-color:var(--g);color:var(--g);
  box-shadow:0 0 0 3px rgba(92,138,74,.2);}
.tl-l{font-size:8px;font-weight:700;color:var(--b2);margin-top:2px;text-align:center;}
.tl-dt{font-size:8px;color:var(--b3);text-align:center;}

/* PANEL */
.panel{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;
  background:#F0F5EE;transform:translateX(100%);transition:transform .22s ease;}
.panel.open{transform:translateX(0);}
.phd{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--wht);
  border-bottom:1px solid var(--bdr);min-height:var(--nh);position:sticky;top:0;z-index:10;}
.ptitle{font-weight:800;font-size:15px;flex:1;}
.pbody{flex:1;overflow-y:auto;padding:12px;padding-bottom:80px;}

/* FINISHER ROW */
.fr{border:1.5px solid var(--bdr);border-radius:10px;padding:12px;
  margin-bottom:8px;background:var(--wht);}
.fr-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap;}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
.cb{border:1.5px solid var(--bdr);border-radius:var(--rs);padding:7px;text-align:center;}
.cb label{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  color:var(--b3);display:block;margin-bottom:3px;}
.cb input{border:none;background:transparent;font-size:18px;font-weight:800;
  text-align:center;padding:0;width:100%;}
.cb input:focus{outline:none;}
.cb .dt{font-size:8px;font-weight:700;margin-top:2px;}

/* PCT BAR */
.pb-wrap{background:var(--bdr);border-radius:20px;height:5px;overflow:hidden;margin-top:3px;}
.pb{height:100%;border-radius:20px;}
.pb-good{background:var(--g);} .pb-ok{background:var(--amb);} .pb-low{background:var(--red);}

/* HIVE ROWS */
.hrow{display:flex;align-items:center;gap:8px;background:var(--gl);
  border:1.5px solid var(--bdr);border-radius:var(--rs);padding:9px 12px;
  cursor:pointer;transition:border-color .15s;margin-bottom:5px;}
.hrow:hover{border-color:var(--g);}

/* LOG */
.log-entry{border-left:3px solid var(--g);padding:7px 10px;margin-bottom:6px;
  border-radius:0 var(--rs) var(--rs) 0;background:var(--gl);}
.lch-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.lch{display:flex;align-items:center;gap:7px;padding:8px 10px;background:var(--cr);
  border:1.5px solid var(--bdr);border-radius:var(--rs);cursor:pointer;font-size:12px;}
.lch:hover{border-color:var(--g);}
.lch input[type=checkbox]{width:14px;height:14px;accent-color:var(--g);cursor:pointer;}
.lch:has(input:checked){border-color:var(--g);background:var(--gl);}

/* DUE BANNER — compact */
.due{background:var(--wht);border:1.5px solid var(--gm);border-radius:12px;
  padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh);}
.due-hd{font-weight:700;font-size:11px;color:var(--g);margin-bottom:6px;
  text-transform:uppercase;letter-spacing:.5px;}
.due-row{display:flex;align-items:center;gap:8px;padding:6px 0;
  border-bottom:1px solid var(--bdr);flex-wrap:wrap;}
.due-row:last-child{border-bottom:none;}

/* DIVIDER */
.dvd{height:1px;background:var(--bdr);margin:10px 0;}
.tsm{font-size:13px;color:var(--b2);} .txs{font-size:11px;color:var(--b3);}
.empty{text-align:center;padding:28px;color:var(--b3);}

/* PROTO BTN */
.proto-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.pbtn{padding:10px 8px;border-radius:var(--rs);border:1.5px solid var(--bdr);
  background:var(--cr);cursor:pointer;text-align:center;font-weight:700;
  font-size:12px;color:var(--b2);font-family:var(--fn);}
.pbtn.active{border-color:var(--g);background:var(--gl);color:var(--g);}
.psub{font-size:9px;font-weight:500;color:var(--b3);display:block;margin-top:1px;}

/* APIARY */
.apy-row{border:1.5px solid var(--bdr);border-radius:10px;margin-bottom:5px;overflow:hidden;}
.apy-hd{display:flex;align-items:center;gap:8px;padding:9px 11px;cursor:pointer;
  background:var(--cr);}
.apy-hd:hover{background:var(--gl);}
.apy-body{display:none;flex-wrap:wrap;gap:5px;padding:9px 11px;
  background:var(--wht);border-top:1px solid var(--bdr);}

/* OUT BANNER */
.out-banner{background:var(--gl);border-radius:var(--rs);padding:10px 12px;margin-top:8px;}

/* BOTTOM BAR */
.bbar{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;
  background:#2C3E28;border-top:1px solid rgba(255,255,255,.08);z-index:200;
  box-shadow:0 -2px 12px rgba(0,0,0,.2);}
.bbar-inner{display:flex;height:100%;}
.bbt{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:1px;cursor:pointer;border:none;background:none;color:#6a8a5a;
  font-size:9px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;}
.bbt.active,.bbt:hover{color:#C8DDB8;}

/* TOAST */
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#2C3E28;color:#C8DDB8;padding:9px 20px;border-radius:24px;
  font-size:13px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.25);
  transition:transform .25s;z-index:999;white-space:nowrap;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);}

/* PIN */
.pin-screen{position:fixed;inset:0;background:#2C3E28;z-index:9999;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:20px;}
.pin-title{color:#C8DDB8;font-size:20px;font-weight:900;letter-spacing:-.5px;}
.pin-sub{color:#6a8a5a;font-size:13px;}
.pin-dots{display:flex;gap:12px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid #4a6a3a;
  background:transparent;transition:background .15s;}
.pin-dot.filled{background:#C8DDB8;border-color:#C8DDB8;}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:210px;}
.pin-key{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  border-radius:10px;color:var(--wht);font-size:20px;font-weight:700;padding:14px;
  text-align:center;cursor:pointer;font-family:var(--fn);}
.pin-key:hover{background:rgba(255,255,255,.14);}
.pin-err{color:#f87171;font-size:12px;font-weight:600;min-height:18px;}

/* CAL */
.row-lbl{text-align:left;font-weight:700;font-size:10px;padding:3px 7px;
  background:var(--gl);white-space:nowrap;position:sticky;left:0;z-index:2;}
.cal-row{cursor:pointer;} .cal-row:hover{opacity:.75;}

@media(max-width:640px){
  nav button{display:none;} .bbar{display:block;} main{padding-bottom:70px;}
  .stats{grid-template-columns:repeat(2,1fr);} .cg{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>
<nav>
  <div class="logo">QCT</div>
  <button class="active" onclick="go('dash')">Home</button>
  <button onclick="go('graft')">Graft</button>
  <button onclick="go('hives')">Hives</button>
  <button onclick="go('cal')">Calendar</button>
  <button onclick="go('stats')">Stats</button>
  <button onclick="go('settings')">Settings</button>
  <div class="nsp"></div>
  <div class="dot" id="dot"></div>
</nav>
<main id="app"></main>
<div class="bbar"><div class="bbar-inner">
  <button class="bbt active" onclick="go('dash')">H<br>Home</button>
  <button class="bbt" onclick="go('graft')">+<br>Graft</button>
  <button class="bbt" onclick="go('hives')">B<br>Hives</button>
  <button class="bbt" onclick="go('cal')">C<br>Cal</button>
  <button class="bbt" onclick="go('stats')">%<br>Stats</button>
  <button class="bbt" onclick="go('settings')">S<br>More</button>
</div></div>
<div class="panel" id="main-panel">
  <div class="phd">
    <button class="btn bg bs" onclick="closePanel()">Back</button>
    <div class="ptitle" id="ptitle"></div>
    <div id="pactions"></div>
  </div>
  <div class="pbody" id="pbody"></div>
</div>
<div id="toast"></div>
<script>
const LOG_TYPES=[
  {v:'inspection',l:'Inspection'},{v:'e-cell',l:'E-cell check'},
  {v:'ss-cell',l:'SS cell check'},{v:'sugar-syrup',l:'Sugar syrup'},
  {v:'add-brood',l:'Add brood'},{v:'brood-up',l:'Brood up'},
  {v:'swarm-check',l:'Swarm check'},{v:'super-on',l:'Super on'},
  {v:'rq',l:'RQ'},{v:'queen-event',l:'Queen event'},
];

// STATE
let DB={hives:[],grafts:[],yard:[],method:'starter_finisher',supaUrl:'',supaKey:''};
let pg='dash',panelMode=null,panelId=null,draft=null;

// PERSIST
function save(){
  try{
    localStorage.setItem('qct3',JSON.stringify({hives:DB.hives,grafts:DB.grafts,yard:DB.yard,method:DB.method}));
    showSaved();
  }catch(e){toast('Save error: '+e.message);}
  supaPush();
}
function showSaved(){
  const el=document.getElementById('save-dot');
  if(el){el.style.opacity='1';setTimeout(()=>el.style.opacity='0',2000);}
}
function loadLocal(){
  try{
    const r=localStorage.getItem('qct3');
    if(r){const d=JSON.parse(r);DB.hives=d.hives||[];DB.grafts=d.grafts||[];DB.yard=d.yard||[];DB.method=d.method||'starter_finisher';}
    const c=localStorage.getItem('qct_cfg2');
    if(c){const x=JSON.parse(c);DB.supaUrl=x.url||'';DB.supaKey=x.key||'';}
  }catch(e){console.error(e);}
}

// SUPABASE
function supaHdr(){return{'apikey':DB.supaKey,'Authorization':'Bearer '+DB.supaKey,'Content-Type':'application/json','Prefer':'return=minimal'};}
function supaBase(t){return DB.supaUrl.replace(/\/$/,'')+'/rest/v1/'+t;}
async function supaLoad(){
  if(!DB.supaUrl||!DB.supaKey)return;
  try{
    const localEmpty = DB.hives.length===0 && DB.grafts.length===0;
    if(localEmpty){
      // New device / fresh install — pull from Supabase
      const[hr,gr]=await Promise.all([
        fetch(supaBase('qct_hives')+'?select=*',{headers:supaHdr()}),
        fetch(supaBase('qct_grafts')+'?select=*',{headers:supaHdr()})
      ]);
      if(!hr.ok||!gr.ok)throw new Error('Fetch failed');
      const rh=await hr.json(),rg=await gr.json();
      DB.hives=rh.map(h=>({...h,log:h.log||[]}));
      DB.grafts=rg.map(g=>({...g,starters:g.starters||[],finishers:g.finishers||[]}));
      localStorage.setItem('qct3',JSON.stringify({hives:DB.hives,grafts:DB.grafts,yard:DB.yard,method:DB.method}));
      toast('Data loaded from Supabase');
    } else {
      // Local has data — push it to Supabase (local is the truth)
      await supaPush();
    }
    setDot(true);
  }catch(e){console.error('Supa load:',e);setDot(false);}
}

// Force pull from Supabase (only used by manual "Sync now" button)
async function supaForcePull(){
  if(!DB.supaUrl||!DB.supaKey)return false;
  try{
    const[hr,gr]=await Promise.all([
      fetch(supaBase('qct_hives')+'?select=*',{headers:supaHdr()}),
      fetch(supaBase('qct_grafts')+'?select=*',{headers:supaHdr()})
    ]);
    if(!hr.ok||!gr.ok)throw new Error('Fetch failed');
    const rh=await hr.json(),rg=await gr.json();
    // Merge: local wins on conflict (newer updated_at)
    const merge=(local,remote)=>{
      const m={};
      local.forEach(x=>m[x.id]=x);
      remote.forEach(x=>{
        const l=m[x.id];
        if(!l){m[x.id]=x;return;}
        const lt=l.updated_at?new Date(l.updated_at).getTime():0;
        const rt=x.updated_at?new Date(x.updated_at).getTime():0;
        if(rt>lt)m[x.id]=x;
      });
      return Object.values(m);
    };
    DB.hives=merge(DB.hives,rh);
    DB.grafts=merge(DB.grafts,rg);
    localStorage.setItem('qct3',JSON.stringify({hives:DB.hives,grafts:DB.grafts,yard:DB.yard,method:DB.method}));
    setDot(true);
    return true;
  }catch(e){console.error('Supa pull:',e);setDot(false);return false;}
}
async function supaPush(){
  if(!DB.supaUrl||!DB.supaKey)return;
  try{
    const ts=new Date().toISOString();
    const hr=DB.hives.map(h=>({id:h.id,type:h.type,name:h.name,queen_status:h.queen_status||'unknown',
      strength:h.strength||3,notes:h.notes||'',log:h.log||[],slide_prepared:h.slide_prepared||null,retired:h.retired||false,updated_at:h.updated_at||ts}));
    const gr=DB.grafts.map(g=>({id:g.id,date:g.date,protocol:g.protocol,breeder_id:g.breeder_id,
      grafted:g.grafted||0,method:g.method||'starter_finisher',cloake_hive_id:g.cloake_hive_id||null,
      starters:g.starters||[],finishers:g.finishers||[],notes:g.notes||'',updated_at:g.updated_at||ts}));
    await Promise.all([
      fetch(supaBase('qct_hives'),{method:'POST',headers:{...supaHdr(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(hr)}),
      fetch(supaBase('qct_grafts'),{method:'POST',headers:{...supaHdr(),'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(gr)}),
    ]);
    setDot(true);
  }catch(e){setDot(false);}
}
function setDot(ok){const d=document.getElementById('dot');if(d)d.className='dot '+(ok?'ok':'err');}

// HELPERS
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5);}
function isCloake(){return DB.method==='cloake';}
function today(){return dayjs().format('YYYY-MM-DD');}
function fmt(d){return d?dayjs(d).format('D MMM'):'--';}
function fmtF(d){return d?dayjs(d).format('D MMM YY'):'--';}
function isPast(d){return d<today();}
function isToday(d){return d===today();}
function hById(id){return DB.hives.find(h=>h.id===id);}
function hByType(t){return DB.hives.filter(h=>h.type===t);}
function gById(id){return DB.grafts.find(g=>g.id===id);}
function dayN(d){return['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][dayjs(d).day()];}
function relDay(d){
  const diff=dayjs(d).diff(dayjs(today()),'day');
  if(diff===0)return'Today';
  if(diff===1)return'Tomorrow';
  if(diff===-1)return'Yesterday';
  if(diff>1&&diff<7)return dayN(d);
  return null;
}
function isWknd(d){const day=dayjs(d).day();return day===0||day===6;}
function numSort(arr){return arr.slice().sort((a,b)=>{const na=parseInt(a.name.replace(/[^0-9]/g,''))||0,nb=parseInt(b.name.replace(/[^0-9]/g,''))||0;return na!==nb?na-nb:a.name.localeCompare(b.name);});}
function hiveLabel(h){
  if(!h) return '?';
  const note=(h.notes||'').trim();
  if(!note) return h.name;
  const short=note.length>24?note.slice(0,24)+'…':note;
  return h.name+' — '+short;
}

// Summarise what's already allocated into a finisher for this graft (saved + in-progress draft)
function finisherAllocSummary(finisherId, gid){
  const g=gById(gid);if(!g)return '';
  const parts=[];
  let total=0;
  // Saved sources from finisher records
  const f=(g.finishers||[]).find(x=>x.hive_id===finisherId);
  if(f && f.sources){
    f.sources.forEach(src=>{
      const S=hById(src.sid);
      parts.push((S?S.name:'?')+':'+src.count);
      total+=src.count||0;
    });
  }
  // In-progress draft rows (not yet saved) that target this finisher
  (g.starters||[]).forEach(s=>{
    const rows=assignDraft[s.hive_id]||[];
    rows.forEach(row=>{
      if(row.fin===finisherId && !row.saved && +row.cells>0){
        const S=hById(s.hive_id);
        parts.push((S?S.name:'?')+':'+row.cells+'*');
        total+=+row.cells;
      }
    });
  });
  if(!parts.length) return '';
  return parts.join(', ')+' ('+total+' in)';
}

// Finisher availability: a finisher is available if it has no active (not-yet-capped) cells in it.
// excludeGraftId: ignore that graft's own records when checking (so you can top up your own batch freely)
function finisherAvailable(finisherId, excludeGraftId){
  const h=hById(finisherId);
  if(h && h.retired) return false;
  const td=today();
  for(const g of DB.grafts){
    if(excludeGraftId && g.id===excludeGraftId) continue;
    const f=(g.finishers||[]).find(x=>x.hive_id===finisherId);
    if(!f) continue;
    const outDate=f.out_date || gOutDate(g);
    if(outDate < td) continue; // fully out already, ignore
    const capDate=f.capped_date || gCapDate(g);
    if(capDate > td) return false; // still growing — unavailable
  }
  return true;
}
function sortedFinishersByAvail(excludeGraftId){
  const sorted=numSort(hByType('finisher'));
  return sorted.slice().sort((a,b)=>{
    const aOk=finisherAvailable(a.id,excludeGraftId)?0:1;
    const bOk=finisherAvailable(b.id,excludeGraftId)?0:1;
    if(aOk!==bOk) return aOk-bOk;
    return numSort([a,b]).indexOf(a) - numSort([a,b]).indexOf(b);
  });
}
function pct(n,d){return d?Math.round(n/d*100):null;}
function pctBar(p){if(p===null)return'';const c=p>=70?'pb-good':p>=40?'pb-ok':'pb-low';return`<div style="display:flex;align-items:center;gap:6px;margin-top:4px"><div class="pb-wrap" style="flex:1"><div class="pb ${c}" style="width:${p}%"></div></div><span style="font-size:11px;font-weight:700;color:var(--b2)">${p}%</span></div>`;}
function gGrafted(g){const s=(g.starters||[]).reduce((a,x)=>a+(x.cells_in||0),0);return s||(g.grafted||0);}
function gOut(g){return(g.finishers||[]).reduce((a,f)=>a+(f.out||0),0);}
function gMated(g){return(g.finishers||[]).reduce((a,f)=>a+(f.mated||0),0);}
function gOutDate(g){return g.protocol==='autumn'?dayjs(g.date).add(2,'day').format('YYYY-MM-DD'):dayjs(g.date).add(10,'day').format('YYYY-MM-DD');}
function gCapDate(g){return dayjs(g.date).add(5,'day').format('YYYY-MM-DD');}
function gDone(g){return gOutDate(g)<today();}
function stamp(g){g.updated_at=new Date().toISOString();}

  if(!scroller){ if(retries>0) setTimeout(()=>centreCalToday(retries-1),100); return; }
  const ths=[...scroller.querySelectorAll('thead tr:nth-child(2) th')];
  const todayTh=ths.find(th=>th.style.borderLeft && th.style.borderLeft.includes('14532D'));
  if(!todayTh || scroller.clientWidth===0){

          ${fr?.out!=null?`<div style="text-align:center"><div style="font-size:16px;font-weight:800;color:var(--g)">${fr.out}</div><div style="font-size:9px;color:var(--b3);text-transform:uppercase">Out</div></div>`:''}
        </div>

          ${canSlideOut?`<button class="btn bp bx" style="font-size:11px" onclick="updGraftFlag('${g.id}','slide_out_done',true);save();document.getElementById('hive-map-popup').remove();render()">🔳 Slide out</button>`:''}

function rDash(){
  const G=DB.grafts.filter(g=>!g.scheduled);
  const tGr=G.reduce((a,g)=>a+gGrafted(g),0);
  const tOut=G.reduce((a,g)=>a+gOut(g),0);
  const tMt=G.reduce((a,g)=>a+gMated(g),0);
  const sp=pct(tOut,tGr);
  const onGo=G.filter(g=>!gDone(g)).reduce((a,g)=>a+(g.finishers||[]).reduce((b,f)=>b+Math.max(0,(f.cells_received||0)-(f.out||0)),0),0);
  const due=[];
  G.forEach(g=>{
    const d=dayjs(g.date);
    if(g.scheduled) return; // scheduled grafts handled separately
    const isCloakeGraft = g.method==='cloake';
    const checks=g.protocol==='autumn'
      ?[{l:'Out',date:gOutDate(g),done:(g.finishers||[]).some(f=>f.out!=null)}]
      :isCloakeGraft
      ?[{l:'🔲 Slide in',date:d.subtract(1,'day').format('YYYY-MM-DD'),done:g.slide_in_done||false},
        {l:'🔳 Slide out',date:d.add(1,'day').format('YYYY-MM-DD'),done:g.slide_out_done||false},
        {l:'Capping check',date:gCapDate(g),done:(g.finishers||[]).some(f=>f.capped!=null)},
        {l:'Cells out',date:gOutDate(g),done:(g.finishers||[]).some(f=>f.out!=null)},
        {l:'Mated check',date:d.add(30,'day').format('YYYY-MM-DD'),done:(g.finishers||[]).some(f=>f.mated!=null)}]
      :[{l:'Assign finishers',date:d.add(1,'day').format('YYYY-MM-DD'),done:(g.finishers||[]).length>0},
        {l:'Capping check',date:gCapDate(g),done:(g.finishers||[]).some(f=>f.capped!=null)},
        {l:'Cells out',date:gOutDate(g),done:(g.finishers||[]).some(f=>f.out!=null)},
        {l:'Mated check',date:d.add(30,'day').format('YYYY-MM-DD'),done:(g.finishers||[]).some(f=>f.mated!=null)}];
    for(const c of checks){if(c.done)continue;const diff=dayjs(c.date).diff(dayjs(),'day');if(diff<=3&&diff>=-2){due.push({g,c,diff});break;}}
  });
  // Slide-in prompts for scheduled grafts
  G.filter(g=>g.scheduled).forEach(g=>{
    const d=dayjs(g.date);
    const cloakeSched=g.method==='cloake';
    const slideInDate=d.subtract(1,'day').format('YYYY-MM-DD');
    const diff=d.diff(dayjs(),'day');
    // Prompt slide in if due (day before graft) — only for cloake
    if(cloakeSched){
      const slideInDiff=dayjs(slideInDate).diff(dayjs(),'day');
      if(slideInDiff<=1&&slideInDiff>=-1&&!g.slide_in_done){
        due.push({g,c:{l:'🔲 Slide in (scheduled graft)',date:slideInDate},diff:slideInDiff});
      }
    }
    // Prompt graft itself on the day
    if(diff<=0&&diff>=-1){
      due.push({g,c:{l:'Graft scheduled — ready to start',date:g.date},diff});
    }
  });
  const dueBanner=due.length?`<div class="due"><div class="due-hd">⚡ Action needed</div>${due.map(({g,c,diff})=>{const B=hById(g.breeder_id);const rd=relDay(c.date);const bg=diff<0?'#fee2e2':diff===0?'#fef3c7':'var(--gl)';const txt=diff<0?'var(--red)':diff===0?'#b45309':'var(--g)';const lb=diff<0?Math.abs(diff)+'d overdue':rd||fmt(c.date);
    const isSlideIn=c.l.includes('Slide in');const isSlideOut=c.l.includes('Slide out');
    const canTick=isSlideIn||isSlideOut;
    const flagKey=isSlideIn?'slide_in_done':'slide_out_done';
    return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--bdr)">
      <div style="width:6px;height:6px;border-radius:50%;background:${txt};flex-shrink:0"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:700;color:var(--ink)">${c.l}</div>
        <div style="font-size:10px;color:var(--b3)">${B?B.name:'?'} · ${fmtF(g.date)}</div>
      </div>
      <div style="font-size:13px;font-weight:800;color:${txt};white-space:nowrap">${lb}</div>
      ${canTick
        ? `<button class="btn bp bx" onclick="updGraftFlag('${g.id}','${flagKey}',true);render()">✓</button>`
        : `<button class="btn bg bx" onclick="openPanel('rec','${g.id}')">Open →</button>`}
    </div>`;}).join('')}</div>`:'';
  const active=G.filter(g=>!gDone(g)&&!g.scheduled).sort((a,b)=>b.date.localeCompare(a.date));
  const completed=G.filter(g=>gDone(g)&&!g.scheduled).sort((a,b)=>b.date.localeCompare(a.date));
  const bC=hByType('breeder').length,sC=hByType('starter').length,fC=hByType('finisher').length;
  return`${rFinisherStatus()}
    ${rYardMap()}
    <div class="stats" style="margin-bottom:8px">
      <div class="stat"><div class="n">${G.length}</div><div class="l">Grafts</div></div>
      <div class="stat"><div class="n">${onGo}</div><div class="l">On the go</div></div>
      <div class="stat"><div class="n">${tOut}</div><div class="l">Out</div></div>
      <div class="stat"><div class="n">${sp!==null?sp+'%':'--'}</div><div class="l">Season %</div></div>
    </div>
    <div class="card">
      <div class="chd">Graft Batches <span class="ml" style="display:flex;gap:6px">
        <button class="btn bo bx" onclick="openScheduleModal()">Schedule</button>
        <button class="btn bp bx" onclick="go('graft')">+ New graft</button>
      </span></div>
      ${active.length?active.map(rGraftCard).join(''):completed.length?'<p class="tsm" style="padding:8px 0">No active batches — all done!</p>':rOnboarding()}
      ${completed.length?`<div style="margin-top:${active.length?'10px':'0'}">
        <div style="display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--gl);border-radius:var(--rs);cursor:pointer"
          onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.chev').textContent=this.nextElementSibling.style.display==='none'?'›':'⌄'">
          <span style="font-size:13px;font-weight:700;color:var(--b2)">Completed batches</span>
          <span class="chip" style="background:var(--wht);color:var(--b2)">${completed.length}</span>
          <span class="chev ml" style="color:var(--b3);font-size:16px">›</span>
        </div>
        <div style="display:none;margin-top:8px;opacity:.7">
          ${completed.map(rGraftCard).join('')}
        </div>
      </div>`:''}
    </div>
    ${rYardChecklist()}
    ${rScheduledGrafts()}
    <div class="card">
      <div class="chd">Apiary <span class="txs">${bC}B · ${sC}S · ${fC}F</span>
        <span class="ml"><button class="btn bg bx" onclick="go('hives')">Manage</button></span></div>
      ${rApiary()}
    </div>`;
}

  if(!DB.hives.length)return`<p class="tsm">No hives. <a href="#" onclick="go('hives')" style="color:var(--g)">Add hives</a></p>`;
  return['breeder','starter','finisher'].map(type=>{
    const hs=hByType(type);if(!hs.length)return'';

        <span class="chip ${cc}">${lbl}</span>

function gNumber(g){
  const allSorted=DB.grafts.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  return allSorted.findIndex(x=>x.id===g.id)+1;
}

// Assign consistent colours to graft dates — same date = same colour
const GRAFT_COLOURS = [
  {bg:'#dbeafe',border:'#93c5fd',text:'#1e40af'},  // blue
  {bg:'#fef9c3',border:'#fde047',text:'#854d0e'},  // yellow
  {bg:'#ffe4e6',border:'#fda4af',text:'#9f1239'},  // rose
  {bg:'#f3e8ff',border:'#d8b4fe',text:'#6b21a8'},  // purple
  {bg:'#ffedd5',border:'#fdba74',text:'#9a3412'},  // orange
  {bg:'#d1fae5',border:'#6ee7b7',text:'#065f46'},  // teal
];
function graftColour(g){
  // Get unique sorted list of graft dates
  const dates=[...new Set(DB.grafts.map(x=>x.date))].sort();
  const idx=dates.indexOf(g.date);
  return GRAFT_COLOURS[idx % GRAFT_COLOURS.length];
}

function gFinisherLabel(g){
  // Returns a short label listing finishers in this graft, e.g. "F1, F2, F3"
  const fins=(g.finishers||[]).map(f=>hById(f.hive_id)).filter(Boolean);
  if(!fins.length) return 'Graft '+gNumber(g);
  const sorted=numSort(fins);
  if(sorted.length<=3) return sorted.map(h=>h.name).join(', ');
  // If more than 3, show first, last and count: "F1–F6 (6)"
  return sorted[0].name+'–'+sorted[sorted.length-1].name+' ('+sorted.length+')';
}

function rGraftCard(g){
  const B=hById(g.breeder_id);
  const outDate=gOutDate(g);const tGr=gGrafted(g),tOut=gOut(g);const gp=pct(tOut,tGr);
  const done=gDone(g);const cellsDue=(g.finishers||[]).reduce((a,f)=>a+Math.max(0,(f.cells_received||0)-(f.out||0)),0);
  const wd=dayN(outDate);const wknd=isWknd(outDate);
  const isA=g.protocol==='autumn';const d=dayjs(g.date);
  const isCloakeG=g.method==='cloake';
  const stages=isA?[{l:'Graft',d:g.date},{l:'Out',d:outDate}]
    :isCloakeG?[{l:'Slide in',d:d.subtract(1,'day').format('YYYY-MM-DD')},{l:'Graft',d:g.date},{l:'Slide out',d:d.add(1,'day').format('YYYY-MM-DD')},{l:'Capped',d:gCapDate(g)},{l:'Out',d:outDate},{l:'Mated',d:d.add(30,'day').format('YYYY-MM-DD')}]
    :[{l:'Graft',d:g.date},{l:'Finishers',d:d.add(1,'day').format('YYYY-MM-DD')},{l:'Capped',d:gCapDate(g)},{l:'Out',d:outDate},{l:'Mated',d:d.add(30,'day').format('YYYY-MM-DD')}];
  const tl=stages.map(s=>{const c=isPast(s.d)?'done':isToday(s.d)?'now':'';return`<div class="tl-n"><div class="tl-d ${c}">${isPast(s.d)?'v':'o'}</div><div class="tl-l">${s.l}</div><div class="tl-dt">${fmt(s.d)}</div></div>`;}).join('');
  const starterBoxes=(g.starters||[]).map(s=>{const H=hById(s.hive_id);const sent=(g.finishers||[]).reduce((a,f)=>{const src=(f.sources||[]).find(x=>x.sid===s.hive_id);return a+(src?src.count:0);},0);const sp2=pct(sent,s.cells_in||0);return`<div style="background:var(--gl);border:1px solid var(--gm);border-radius:var(--rs);padding:5px 8px;text-align:center;min-width:52px"><div style="font-size:11px;font-weight:700;color:var(--g)">${H?H.name:'?'}</div><div class="txs">${s.cells_in||0} in</div>${sp2!==null?`<div style="font-size:10px;font-weight:700;color:${sp2>=70?'var(--g)':sp2>=40?'var(--amb)':'var(--red)'}">${sp2}%</div>`:''}</div>`;}).join('');
  const finBoxes=(g.finishers||[]).map(f=>{const H=hById(f.hive_id);const fp=pct(f.out||0,f.cells_received||0);
    const estCap2=f.capped_date||gCapDate(g);
    let stg,stgC;
    if(f.out!=null&&f.out>0){stg='Out';stgC='var(--g)';}
    else if((f.capped!=null&&f.capped>0)||estCap2<=today()){stg='Capped';stgC='#92400e';}
    else{stg='Larval';stgC='#1e40af';}
    return`<div style="background:var(--gl);border:1px solid var(--gm);border-radius:var(--rs);padding:5px 8px;text-align:center;min-width:52px"><div style="font-size:11px;font-weight:700;color:var(--g)">${H?H.name:'?'}</div><div style="font-size:9px;font-weight:700;color:${stgC}">${stg}</div><div class="txs">${f.cells_received||0} in</div><div style="font-size:14px;font-weight:800;color:${fp===null?'var(--b3)':fp>=70?'var(--g)':fp>=40?'var(--amb)':'var(--red)'}">${f.out??'--'}</div>${fp!==null?`<div style="font-size:10px;font-weight:700;color:${fp>=70?'var(--g)':fp>=40?'var(--amb)':'var(--red)'}">${fp}%</div>`:''}</div>`;}).join('');
  const gc=graftColour(g);
  return`<div class="gc" style="border-color:${gc.border}">
    <div class="gc-hd" style="background:${gc.bg}" onclick="this.nextElementSibling.classList.toggle('open')">
      <div style="flex:1">
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
          <span class="chip" style="background:${gc.border};color:${gc.text};font-weight:800">${gFinisherLabel(g)}</span>
          <strong style="font-size:14px">${fmtF(g.date)}</strong>
          <span class="chip ${isA?'caut':'cstd'}">${isA?'Autumn':'Standard'}</span>
          <span class="chip cB" style="font-size:10px">${B?B.name:'?'}</span>
        </div>
        <div style="margin-top:4px;display:flex;align-items:baseline;gap:4px">
          <span style="font-size:9px;font-weight:600;color:var(--b3);text-transform:uppercase;letter-spacing:.3px">Out</span>
          <span style="font-size:16px;font-weight:800;color:${wknd?'var(--red)':done?'var(--b3)':'var(--g)'}">${relDay(outDate)||wd} ${fmt(outDate)}</span>
          ${wknd&&!done?'<span style="font-size:9px;font-weight:700;color:var(--red)">Wknd</span>':''}${done?'<span class="txs">Done</span>':''}
        </div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${tOut>0?`<div style="font-size:20px;font-weight:800;color:var(--g);line-height:1">${tOut}</div><div style="font-size:9px;color:var(--b3);text-transform:uppercase">cells out</div>`:!done&&cellsDue>0?`<div style="font-size:20px;font-weight:800;color:var(--g);line-height:1">${cellsDue}</div><div style="font-size:9px;color:var(--b3);text-transform:uppercase">cells due</div>`:''}
        ${gp!==null?`<span class="chip ${gp>=70?'cok':gp>=40?'cwarn':'cbad'}" style="margin-top:2px">${gp}%</span>`:''}
      </div>
    </div>
    <div class="gc-body">
      <div class="tl">${tl}</div>
      ${gp!==null?`<div class="txs mt8">Out / grafted</div>${pctBar(gp)}`:''}

      ${isCloakeG ? (()=>{
        const cf=(g.finishers||[])[0];
        const grafted=tGr||0;
        const started=cf?.cells_received||grafted;
        const capped=cf?.capped||0;
        const out=cf?.out||0;
        const mated=cf?.mated||0;
        const statPill=(label,val,total,col)=>{
          const p=total>0?Math.round(val/total*100):null;
          const colFn=p===null?'var(--b3)':p>=70?'var(--g)':p>=40?'var(--amb)':'var(--red)';
          return`<div style="flex:1;text-align:center;padding:8px 4px;background:var(--cr);border-radius:var(--rs)">
            <div style="font-size:18px;font-weight:800;color:${col||colFn}">${val||'--'}</div>
            <div style="font-size:9px;font-weight:700;text-transform:uppercase;color:var(--b3);margin-bottom:2px">${label}</div>
            ${p!==null?`<div style="font-size:10px;font-weight:700;color:${colFn}">${p}%</div>`:''}
          </div>`;
        };
        return`<div style="display:flex;gap:6px;margin-top:10px">
          ${statPill('Started',started,grafted,'#1e40af')}
          ${statPill('Capped',capped,grafted,'#92400e')}
          ${statPill('Out',out,grafted)}
          ${statPill('Mated',mated,grafted)}
        </div>`;
      })() : `
      <div class="mt12" style="border:1px solid var(--bdr);border-radius:var(--rs);overflow:hidden">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--gl);cursor:pointer"
          onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none';this.querySelector('.chev').textContent=this.nextElementSibling.style.display==='none'?'›':'⌄'">
          <span style="font-size:12px;font-weight:700">Breeder → Starters</span>
          <span class="chev ml" style="color:var(--b3)">›</span>
        </div>
        <div style="display:none;align-items:flex-start;gap:5px;flex-wrap:wrap;padding:10px 12px">
          <div style="background:var(--gl);border:1px solid var(--gm);border-radius:var(--rs);padding:5px 8px;text-align:center">
            <div style="font-size:11px;font-weight:700;color:var(--g)">${B?B.name:'?'}</div>
            <div class="txs">${tGr} grafted</div>
          </div>
          ${(g.starters||[]).length?'<div style="color:var(--b3);font-size:16px;padding-top:8px">→</div>':''}
          <div style="display:flex;gap:4px;flex-wrap:wrap">${starterBoxes||'<span class="txs">No starters yet</span>'}</div>
        </div>
      </div>

      <div class="mt8" style="border:1px solid var(--bdr);border-radius:var(--rs);overflow:hidden">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--gl);cursor:pointer"
          onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'flex':'none';this.querySelector('.chev').textContent=this.nextElementSibling.style.display==='none'?'›':'⌄'">
          <span style="font-size:12px;font-weight:700">Starters → Finishers</span>
          <span class="chev ml" style="color:var(--b3)">›</span>
        </div>
        <div style="display:none;align-items:center;gap:4px;flex-wrap:wrap;padding:10px 12px">
          ${finBoxes||'<span class="txs">Not assigned yet</span>'}
        </div>
      </div>`}

      ${(g.yards||[]).length?`<div class="mt8" style="border:1px solid var(--bdr);border-radius:var(--rs);overflow:hidden">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--gl);cursor:pointer"
          onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.chev').textContent=this.nextElementSibling.style.display==='none'?'›':'⌄'">
          <span style="font-size:12px;font-weight:700">Yard Allocation</span>
          <span class="chev ml" style="color:var(--b3)">›</span>
        </div>
        <div style="display:none;padding:10px 12px">
          ${g.yards.map(y=>{const F=hById(y.fid);return`<div style="display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px"><span class="chip cF" style="font-size:10px">${F?F.name:'?'}</span><strong>${y.cells||0}</strong><span style="color:var(--b3)">→</span><span>${y.yard||'(no yard set)'}</span></div>`;}).join('')}
        </div>
      </div>`:''}

      <div class="dvd"></div>
      <div class="brow">
        <button class="btn bp bs" onclick="openPanel('rec','${g.id}')">Record / update</button>
        <button class="btn bo bs" onclick="startEdit('${g.id}')">Edit</button>
        <button class="btn bd bs" onclick="delGraft('${g.id}')">Delete</button>
      </div>
    </div>
  </div>`;
}

// GRAFT FORM
function initDraft(existing){
  if(existing){draft={...existing,starters:(existing.starters||[]).map(s=>({...s}))};}
  else{draft={id:null,date:today(),protocol:'standard',breeder_id:hByType('breeder')[0]?.id||'',starters:[],notes:'',grafted:0,cloake_hive_id:'',sky:'',temp:'',precip:false,precipTypes:[],graft_time:new Date().toTimeString().slice(0,5)};}
}
function startEdit(id){initDraft(gById(id));go('graft');}

function rGraft(){
  if(!draft)initDraft(null);
  const f=draft;
  const breeders=hByType('breeder').filter(h=>!h.retired);
  const starters=numSort(hByType('starter').filter(h=>!h.retired));
  const isA=f.protocol==='autumn';
  if(!breeders.length)return`<div class="card"><div class="chd">Set up hives first</div><p class="tsm">Add at least one breeder.</p><button class="btn bp mt12" onclick="go('hives')">Set up hives</button></div>`;
  const d=dayjs(f.date);
  const outDate=isA?d.add(2,'day').format('YYYY-MM-DD'):d.add(10,'day').format('YYYY-MM-DD');
  const capDate=isA?null:d.add(5,'day').format('YYYY-MM-DD');
  const wd=dayN(outDate);const wknd=isWknd(outDate);
  const cloake=isCloake();
  const stages=isA?[{l:'Graft',d:f.date},{l:'Out',d:outDate}]
    :cloake?[{l:'Slide in',d:d.subtract(1,'day').format('YYYY-MM-DD')},{l:'Graft',d:f.date},{l:'Slide out',d:d.add(1,'day').format('YYYY-MM-DD')},{l:'Capped',d:capDate},{l:'Out',d:outDate},{l:'Mated',d:d.add(30,'day').format('YYYY-MM-DD')}]
    :[{l:'Graft',d:f.date},{l:'Finishers',d:d.add(1,'day').format('YYYY-MM-DD')},{l:'Capped',d:capDate},{l:'Out',d:outDate},{l:'Mated',d:d.add(30,'day').format('YYYY-MM-DD')}];
  const tl=stages.map(s=>{const c=isPast(s.d)?'done':isToday(s.d)?'now':'';return`<div class="tl-n"><div class="tl-d ${c}">${isPast(s.d)?'v':'o'}</div><div class="tl-l">${s.l}</div><div class="tl-dt">${fmt(s.d)}</div></div>`;}).join('');
  const totalCells=f.starters.reduce((a,s)=>a+(+s.cells_in||0),0);
  const saRows=starters.map(h=>{const ex=f.starters.find(s=>s.hive_id===h.id);const val=ex?.cells_in||'';return`<div style="display:flex;align-items:center;gap:10px;padding:10px;background:var(--gl);border-radius:var(--rs);margin-bottom:6px">
    <span class="chip cS">${h.name}</span>
    <span class="tsm" style="flex:1">cells grafted in</span>
    <input type="number" min="0" placeholder="0" value="${val}"
      style="width:80px;padding:8px;text-align:center;font-size:18px;font-weight:800;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)"
      onchange="setSC('${h.id}',+this.value)">
  </div>`;}).join('');
  return`<div class="card">
    <div class="chd">${f.id?'Edit Graft':'New Graft'}${f.id?`<button class="btn bg bx ml" onclick="cancelGraft()">Cancel</button>`:''}</div>
    <div class="proto-row">
      <button class="pbtn ${!isA?'active':''}" onclick="draft.protocol='standard';render()">Standard<span class="psub">10 days</span></button>
      <button class="pbtn ${isA?'active':''}" onclick="draft.protocol='autumn';render()">Autumn<span class="psub">2 days</span></button>
    </div>
    <div class="tl">${tl}</div>
    <div class="out-banner">
      ${!isA?`<div style="font-size:13px;color:var(--b2);margin-bottom:4px">Capped: <strong>${dayN(capDate)} ${fmt(capDate)}</strong></div>`:''}
      <div style="font-size:15px">Cells out: <strong style="font-size:18px;color:${wknd?'var(--red)':'var(--g)'}">${wd} ${fmt(outDate)}</strong>${wknd?' <span style="color:var(--red);font-size:11px;font-weight:700">Weekend</span>':''}</div>
    </div>
    <div class="r2 mt12">
      <div class="field"><label>Graft Date</label><input type="date" value="${f.date}" onchange="draft.date=this.value;render()"></div>
      <div class="field"><label>Time</label><input type="time" value="${f.graft_time||''}" onchange="draft.graft_time=this.value"></div>
      <div class="field"><label>Breeder</label>
        <select onchange="draft.breeder_id=this.value">
          <option value="">Select...</option>
          ${breeders.map(h=>`<option value="${h.id}" ${f.breeder_id===h.id?'selected':''}>${h.name}</option>`).join('')}
        </select></div>
    </div>
    ${cloake?`<div class="mt12">
      <div class="lbl">Cloake Board Hive</div>
      <p class="tsm" style="margin-bottom:8px">Select the single hive being used with the cloake board.</p>
      <select onchange="draft.cloake_hive_id=this.value" style="width:100%;padding:10px;font-size:15px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--cr)">
        <option value="">Select hive...</option>
        ${numSort(hByType('finisher').filter(h=>!h.retired)).map(h=>`<option value="${h.id}" ${f.cloake_hive_id===h.id?'selected':''}>${hiveLabel(h)}</option>`).join('')}
      </select>
      <div class="field mt8"><label>Cells Grafted</label>
        <input type="number" min="0" placeholder="e.g. 45" value="${f.grafted||''}" oninput="draft.grafted=+this.value"
          style="font-size:18px;font-weight:800;text-align:center"></div>
    </div>`
    :starters.length?`<div class="mt12">
      <div class="lbl">Starters — cells grafted into each</div>
      ${saRows}
      <div style="padding:10px;background:var(--gl);border-radius:var(--rs);text-align:center">
        <span class="tsm">Total: </span><strong style="font-size:20px;color:var(--g)">${totalCells}</strong><span class="tsm"> cells grafted</span>
      </div></div>`:`<p class="tsm mt12" style="color:var(--b3)">No starters set up. <a href="#" onclick="go('hives')" style="color:var(--g)">Add starters</a></p>`}
    <div class="r2 mt12">
      <div class="field">
        <label>Sky Condition</label>
        <select onchange="draft.sky=this.value">
          <option value="">Select...</option>
          <option value="CLR" ${f.sky==='CLR'?'selected':''}>Clear — No clouds</option>
          <option value="FEW" ${f.sky==='FEW'?'selected':''}>Few — Up to 2/8 cloud</option>
          <option value="SCT" ${f.sky==='SCT'?'selected':''}>Scattered — 3–4/8 cloud</option>
          <option value="BKN" ${f.sky==='BKN'?'selected':''}>Broken — 4–8/8 cloud</option>
          <option value="OVC" ${f.sky==='OVC'?'selected':''}>Overcast — Full cover</option>
          <option value="X"   ${f.sky==='X'?'selected':''}>Obscured — Fog/smoke</option>
        </select>
      </div>
      <div class="field">
        <label>Temperature (°C)</label>
        <input type="number" step="0.5" placeholder="e.g. 22" value="${f.temp||''}" onchange="draft.temp=this.value">
      </div>
    </div>

    <div class="field mt12">
      <label>Precipitation</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer">
          <input type="checkbox" id="precip-check" style="width:18px;height:18px;accent-color:var(--g);cursor:pointer"
            ${f.precip?'checked':''} onchange="draft.precip=this.checked;document.getElementById('precip-types').style.display=this.checked?'flex':'none'">
          Precipitation present
        </label>
      </div>
      <div id="precip-types" style="display:${f.precip?'flex':'none'};flex-wrap:wrap;gap:6px">
        ${[
          {v:'NIL',l:'None'},
          {v:'R-L',l:'Light rain'},
          {v:'R-M',l:'Moderate rain'},
          {v:'R-H',l:'Heavy rain'},
          {v:'S',  l:'Snow'},
          {v:'RS', l:'Rain & snow'},
          {v:'G',  l:'Graupel/hail'},
          {v:'ZR', l:'Freezing rain'},
          {v:'RV', l:'Very light rain'},
        ].map(p=>`<label style="display:flex;align-items:center;gap:5px;font-size:12px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--ink);cursor:pointer;padding:5px 10px;border:1.5px solid var(--bdr);border-radius:20px;background:${(f.precipTypes||[]).includes(p.v)?'var(--gl)':'var(--wht)'}">
          <input type="checkbox" style="width:14px;height:14px;accent-color:var(--g);cursor:pointer"
            value="${p.v}" ${(f.precipTypes||[]).includes(p.v)?'checked':''}
            onchange="const t=draft.precipTypes||[];draft.precipTypes=this.checked?[...t,'${p.v}']:t.filter(x=>x!=='${p.v}')">
          ${p.l}
        </label>`).join('')}
      </div>
    </div>

    <div class="field mt12"><label>Notes</label><textarea placeholder="Observations..." onchange="draft.notes=this.value">${f.notes||''}</textarea></div>
    <div class="brow mt12">
      <button class="btn bp" onclick="saveGraft()">Save graft</button>
      ${!f.id?`<button class="btn bo" onclick="openScheduleModal()">Schedule</button>`:''}
      <button class="btn bg" onclick="cancelGraft()">Cancel</button>
    </div>
  </div>`;
}

function setSC(hive_id,count){
  if(!draft.starters)draft.starters=[];
  const ex=draft.starters.find(s=>s.hive_id===hive_id);
  if(count>0){if(ex)ex.cells_in=count;else draft.starters.push({hive_id,cells_in:count});}
  else{draft.starters=draft.starters.filter(s=>s.hive_id!==hive_id);}
}

function saveGraft(){
  const f=draft;
  if(!f.breeder_id){toast('Select a breeder');return;}
  const cloakeMode=isCloake();
  if(cloakeMode && !f.cloake_hive_id){toast('Select a cloake board hive');return;}
  // For cloake: auto-create a finisher record for the single hive
  let existingFinishers=f.id?(gById(f.id)?.finishers||[]):[];
  if(cloakeMode && f.cloake_hive_id && !existingFinishers.length){
    const d2=dayjs(f.date);
    existingFinishers=[{hive_id:f.cloake_hive_id,cells_received:f.grafted||0,sources:[],
      capped:null,out:null,mated:null,
      capped_date:d2.add(5,'day').format('YYYY-MM-DD'),
      out_date:d2.add(10,'day').format('YYYY-MM-DD')}];
  } else if(cloakeMode && f.cloake_hive_id){
    // Update existing finisher hive and cells
    existingFinishers=existingFinishers.map((fin,i)=>i===0?{...fin,hive_id:f.cloake_hive_id,cells_received:f.grafted||fin.cells_received}:fin);
  }
  const g={
    id:f.id||uid(),date:f.date,protocol:f.protocol,breeder_id:f.breeder_id,
    graft_time:f.graft_time||new Date().toTimeString().slice(0,5),
    method:cloakeMode?'cloake':'starter_finisher',
    cloake_hive_id:f.cloake_hive_id||null,
    grafted:f.grafted||0,
    starters:cloakeMode?[]:(f.starters||[]).filter(s=>s.cells_in>0),
    finishers:cloakeMode?existingFinishers:existingFinishers,
    notes:f.notes||'',sky:f.sky||'',temp:f.temp||'',precip:f.precip||false,precipTypes:f.precipTypes||[],updated_at:new Date().toISOString()
  };
  const idx=DB.grafts.findIndex(x=>x.id===g.id);
  if(idx>=0)DB.grafts[idx]=g;else DB.grafts.unshift(g);
  save();draft=null;toast('Graft saved');go('dash');
}
function cancelGraft(){draft=null;go('dash');}

function openScheduleModal(){
  const existing=document.getElementById('schedule-modal');
  if(existing)existing.remove();
  const breeders=hByType('breeder').filter(h=>!h.retired);
  const m=document.createElement('div');
  m.id='schedule-modal';
  m.style.cssText='position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center';
  m.innerHTML=`<div style="background:var(--wht);border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%;max-width:680px;box-shadow:0 -4px 24px rgba(0,0,0,.2)">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">
      <span style="font-size:16px;font-weight:800">Schedule a Graft</span>
      <button onclick="document.getElementById('schedule-modal').remove()" style="margin-left:auto;background:none;border:none;font-size:22px;cursor:pointer;color:var(--b3)">×</button>
    </div>
    <div class="r2">
      <div class="field">
        <label>Date</label>
        <input type="date" id="sched-date" value="${dayjs().add(7,'day').format('YYYY-MM-DD')}">
      </div>
      <div class="field">
        <label>Breeder</label>
        <select id="sched-breeder">
          <option value="">Select...</option>
          ${breeders.map(h=>`<option value="${h.id}">${h.name}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field mt12">
      <label>Protocol</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px">
        <button id="sched-std" class="pbtn active" onclick="document.getElementById('sched-std').classList.add('active');document.getElementById('sched-aut').classList.remove('active')">
          Standard<span class="psub">10 days</span>
        </button>
        <button id="sched-aut" class="pbtn" onclick="document.getElementById('sched-aut').classList.add('active');document.getElementById('sched-std').classList.remove('active')">
          Autumn<span class="psub">2 days</span>
        </button>
      </div>
    </div>
    <button class="btn bp bb mt12" onclick="saveScheduledGraft()">Schedule graft</button>
  </div>`;
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  document.body.appendChild(m);
  setTimeout(()=>document.getElementById('sched-date')?.focus(),50);
}

function saveScheduledGraft(){
  const date=document.getElementById('sched-date')?.value;
  const breederId=document.getElementById('sched-breeder')?.value;
  const protocol=document.getElementById('sched-aut')?.classList.contains('active')?'autumn':'standard';
  if(!date){toast('Pick a date');return;}
  const g={
    id:uid(),date,protocol,breeder_id:breederId||'',
    method:isCloake()?'cloake':'starter_finisher',
    scheduled:true,started:false,
    starters:[],finishers:[],notes:'',
    graft_time:'',sky:'',temp:'',precip:false,precipTypes:[],
    updated_at:new Date().toISOString()
  };
  DB.grafts.unshift(g);
  save();
  document.getElementById('schedule-modal')?.remove();
  toast('Graft scheduled for '+fmtF(date));
  render();
}
function scheduleGraft(){
  const f=draft;
  if(!f.breeder_id){toast('Select a breeder');return;}
  if(!f.date){toast('Select a date');return;}
  const g={
    id:f.id||uid(),date:f.date,protocol:f.protocol||'standard',breeder_id:f.breeder_id,
    method:isCloake()?'cloake':'starter_finisher',
    scheduled:true,started:false,
    starters:[],finishers:[],notes:f.notes||'',
    graft_time:'',sky:'',temp:'',precip:false,precipTypes:[],
    updated_at:new Date().toISOString()
  };
  const idx=DB.grafts.findIndex(x=>x.id===g.id);
  if(idx>=0)DB.grafts[idx]=g;else DB.grafts.unshift(g);
  save();draft=null;toast('Graft scheduled for '+fmtF(g.date));go('dash');
}
function delGraft(id){if(!confirm('Delete this graft?'))return;DB.grafts=DB.grafts.filter(g=>g.id!==id);save();toast('Deleted');render();}

// RECORD PANEL
function renderRecPanel(id){
  const g=gById(id);if(!g)return;
  const B=hById(g.breeder_id);const isA=g.protocol==='autumn';
  document.getElementById('ptitle').textContent=gFinisherLabel(g)+' -- '+fmtF(g.date)+(g.graft_time?' at '+g.graft_time:'')+' -- '+(B?B.name:'?');
  document.getElementById('pactions').innerHTML=`<button class="btn bg bx" onclick="startEdit('${id}');closePanel()">Edit</button>`;
  const tGr=gGrafted(g),tOut=gOut(g),tMt=gMated(g);
  const tIn=(g.finishers||[]).reduce((a,f)=>a+(f.cells_received||0),0);
  const tCapped=(g.finishers||[]).reduce((a,f)=>a+(f.capped||0),0);
  const gp=pct(tOut,tGr);
  const finishers=numSort(hByType('finisher'));

  // Starter summary
  const stSummary=(g.starters||[]).map(s=>{
    const H=hById(s.hive_id);
    const sent=(g.finishers||[]).reduce((a,f)=>{const src=(f.sources||[]).find(x=>x.sid===s.hive_id);return a+(src?src.count:0);},0);
    const accepted=s.cells_accepted!=null?s.cells_accepted:null;
    // Starter %: cells_accepted / cells_in (acceptance rate)
    const acceptPct=accepted!=null?pct(accepted,s.cells_in||0):null;
    // Allocation %: sent to finishers / cells_accepted
    const allocPct=accepted!=null&&accepted>0?pct(sent,accepted):null;
    return`<div style="padding:10px;background:var(--gl);border-radius:var(--rs);margin-bottom:6px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
        <span class="chip cS">${H?H.name:'?'}</span>
        <span class="tsm">${s.cells_in||0} grafted in</span>
        ${accepted!=null?`<span class="tsm">· ${accepted} accepted</span>`:''}
        ${acceptPct!==null?`<span class="chip ${acceptPct>=70?'cok':acceptPct>=40?'cwarn':'cbad'}" style="margin-left:auto">${acceptPct}%</span>`:'<span class="txs" style="margin-left:auto;color:var(--b3)">acceptance not recorded</span>'}
      </div>
      ${sent>0?`<div class="txs">${sent} sent to finishers${allocPct!==null?' · '+allocPct+'% allocated':''}</div>`:''}
    </div>`;
  }).join('');

  // Assign section — one card per starter, with accepted cells confirmation + finisher rows
  const assignRows=(g.starters||[]).map(s=>{
    const H=hById(s.hive_id);
    const alreadySent=(g.finishers||[]).reduce((a,f)=>{const src=(f.sources||[]).find(x=>x.sid===s.hive_id);return a+(src?src.count:0);},0);
    const accepted = s.cells_accepted != null ? s.cells_accepted : (assignDraft[s.hive_id+'_accepted'] ?? '');
    const acceptedNum = +accepted || 0;
    const sp = acceptedNum > 0 ? pct(acceptedNum, s.cells_in||0) : null;
    // Pre-populate assignDraft rows from saved finisher sources if not already loaded for this starter
    if(!assignDraft[s.hive_id]){
      const savedRows=[];
      (g.finishers||[]).forEach(f=>{
        (f.sources||[]).forEach(src=>{
          if(src.sid===s.hive_id) savedRows.push({cells:src.count, fin:f.hive_id, saved:true});
        });
      });
      assignDraft[s.hive_id]=savedRows.length?savedRows:[{cells:'',fin:''}];
    }
    const finRows=assignDraft[s.hive_id].map((row,ri)=>`
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <input type="number" min="0" placeholder="cells" value="${row.cells||''}"
          style="width:72px;padding:8px;text-align:center;font-size:16px;font-weight:800;border:1.5px solid ${row.saved?'var(--g)':'var(--bdr)'};border-radius:var(--rs);background:${row.saved?'var(--gl)':'var(--wht)'}"
          oninput="setAD('${s.hive_id}',${ri},'cells',+this.value);updateLeftCounter('${s.hive_id}',${acceptedNum});refreshAllFinDropdowns('${id}')">
        <span style="color:var(--b3)">→</span>
        <select data-fin-select="1" style="flex:1;padding:8px;font-size:14px;border:1.5px solid ${row.saved?'var(--g)':'var(--bdr)'};border-radius:var(--rs);background:${row.saved?'var(--gl)':'var(--wht)'}"
          onchange="setAD('${s.hive_id}',${ri},'fin',this.value);refreshAllFinDropdowns('${id}')">
          <option value="">Select F...</option>
          ${sortedFinishersByAvail(id).map(f=>{const av=finisherAvailable(f.id,id);const sum=finisherAllocSummary(f.id,id);return `<option value="${f.id}" ${row.fin===f.id?'selected':''} style="${av?'':'color:#b0b0b0'}">${av?'✓ ':'⊘ '}${hiveLabel(f)}${sum?' — '+sum:av?' available':' growing'}</option>`;}).join('')}
        </select>
        ${row.saved?'<span class="chip cok" style="font-size:9px">saved</span>':''}
        ${assignDraft[s.hive_id].length>1?`<button class="btn bd bx" onclick="removeAD('${s.hive_id}',${ri});renderStarterCard('${s.hive_id}','${id}')">x</button>`:''}
      </div>`).join('');
    const finAssigned=assignDraft[s.hive_id].reduce((a,r)=>a+(+r.cells||0),0);
    const stillLeft=acceptedNum-finAssigned;
    return`<div style="background:var(--gl);border-radius:var(--rs);padding:12px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
        <span class="chip cS">${H?H.name:'?'}</span>
        <span class="tsm">${s.cells_in||0} grafted in</span>
        ${sp!==null?`<span class="chip ${sp>=70?'cok':sp>=40?'cwarn':'cbad'}">${sp}%</span>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:8px;background:var(--wht);border-radius:var(--rs);border:1.5px solid var(--bdr)">
        <span class="txs" style="min-width:100px">Cells accepted:</span>
        <input type="number" min="0" max="${s.cells_in||0}" placeholder="how many started?"
          value="${accepted}"
          style="width:80px;padding:8px;text-align:center;font-size:18px;font-weight:800;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--cr)"
          oninput="assignDraft['${s.hive_id}_accepted']=+this.value;updateLeftCounter('${s.hive_id}',+this.value)">
        <span class="txs">of ${s.cells_in||0}</span>
        ${sp!==null?`<span style="font-size:11px;font-weight:700;color:${sp>=70?'var(--g)':sp>=40?'var(--amb)':'var(--red)'};margin-left:4px">${sp}%</span>`:''}
      </div>
      <div class="lbl" style="margin-bottom:6px">Allocate to finishers:</div>
      <div id="rows-${s.hive_id}">${finRows}</div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:6px">
        <button class="btn badd bx" onclick="addAD('${s.hive_id}');renderStarterCard('${s.hive_id}','${id}')">+ Another finisher</button>
        <span id="left-${s.hive_id}" style="font-size:12px;font-weight:700;color:${stillLeft>0?'var(--amb)':stillLeft===0&&acceptedNum>0?'var(--g)':'var(--b3)'}">
          ${acceptedNum>0?(stillLeft>0?stillLeft+' left to allocate':'all allocated'):'Enter accepted cells above'}
        </span>
      </div>
    </div>`;
  }).join('');

  const noStarters=!(g.starters||[]).length;
  const isCloakeRec=g.method==='cloake';

  // Finisher records
  const d=dayjs(g.date);
  const finRows=(g.finishers||[]).map((f,i)=>{
    const H=hById(f.hive_id);const fp=pct(f.out||0,f.cells_received||0);
    const estCap=f.capped_date||d.add(5,'day').format('YYYY-MM-DD');
    const estOut=f.out_date||d.add(10,'day').format('YYYY-MM-DD');
    const wkndO=isWknd(estOut);
    const srcTxt=(f.sources||[]).map(s=>{const H2=hById(s.sid);return(H2?H2.name:'?')+':'+s.count;}).join(' + ');
    // Stage badge: Larval (pre-capping) -> Capped -> Out
    let stage,stageStyle;
    if(isA){ stage = (f.out!=null&&f.out>0) ? 'Out' : 'Growing'; stageStyle = stage==='Out'?'background:var(--gl);color:var(--g)':'background:#dbeafe;color:#1e40af'; }
    else if(f.out!=null&&f.out>0){ stage='Out'; stageStyle='background:var(--gl);color:var(--g)'; }
    else if((f.capped!=null&&f.capped>0) || estCap<=today()){ stage='Capped'; stageStyle='background:#fef3c7;color:#92400e'; }
    else { stage='Larval'; stageStyle='background:#dbeafe;color:#1e40af'; }
    return`<div class="fr">
      <div class="fr-hd">
        <span class="chip cF">${H?H.name:'?'}</span>
        <span class="chip" style="${stageStyle}">${stage}</span>
        ${H&&H.notes?`<span class="txs" style="font-style:italic">${H.notes}</span>`:''}
        <span class="txs">${f.cells_received||0} in${srcTxt?' ('+srcTxt+')':''}</span>
        ${fp!==null?`<span class="chip ${fp>=70?'cok':fp>=40?'cwarn':'cbad'}" style="margin-left:auto">${fp}%</span>`:''}
        <button class="btn bd bx" onclick="remFin('${id}',${i})">x</button>
      </div>
      <div class="cg">
        <div class="cb" style="${stage==='Larval'||stage==='Growing'?'background:#dbeafe;border-color:#93c5fd':''}"><label>Started</label><input type="number" min="0" value="${f.cells_received||''}" onchange="updFin('${id}',${i},'cells_received',+this.value)"></div>
        ${!isA?`<div class="cb" style="${stage==='Capped'?'background:#fef3c7;border-color:#fcd34d':''}"><label>Capped</label><input type="number" min="0" value="${f.capped??''}" onchange="updFin('${id}',${i},'capped',this.value===''?null:+this.value)"><div class="dt" style="color:var(--amb)">${dayN(estCap)} ${fmt(estCap)}</div></div>`:''}
        <div class="cb" style="${stage==='Out'?'background:var(--gl);border-color:var(--gm)':''}"><label>Out</label><input type="number" min="0" value="${f.out??''}" onchange="updFin('${id}',${i},'out',this.value===''?null:+this.value)"><div class="dt" style="color:${wkndO?'var(--red)':'var(--g)'}">${dayN(estOut)} ${fmt(estOut)}${wkndO?' !':''}</div></div>
      </div>
      <div style="margin-top:8px;max-width:160px">
        <div class="cb" style="background:var(--gl)"><label>Mated</label><input type="number" min="0" value="${f.mated??''}" onchange="updFin('${id}',${i},'mated',this.value===''?null:+this.value)"></div>
      </div>
      ${!isA?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <div class="field" style="flex:1"><label style="font-size:9px">Capped date</label><input type="date" style="font-size:12px;padding:6px 8px" value="${estCap}" onchange="updFin('${id}',${i},'capped_date',this.value)"></div>
        <div class="field" style="flex:1"><label style="font-size:9px">Out date</label><input type="date" style="font-size:12px;padding:6px 8px" value="${estOut}" onchange="updFin('${id}',${i},'out_date',this.value)"></div>
      </div>`:''}
    </div>`;
  }).join('');

  // Standalone yard allocation table — F | Cells | Yard, independent of finisher's own counts
  if(!g.yards) g.yards=[];
  // Only finishers belonging to this graft, where cells are due/marked out today (or already have an out count entered)
  const outFinishers = (g.finishers||[]).filter(f=>{
    const outDate = f.out_date || gOutDate(g);
    return outDate <= today() || (f.out!=null && f.out>0);
  });
  const totalOutCells = outFinishers.reduce((a,f)=>a+(f.out||0),0);
  const totalYardAllocated = g.yards.reduce((a,y)=>a+(+y.cells||0),0);
  const yardLeftGraft = totalOutCells - totalYardAllocated;
  const yardRows = g.yards.map((y,yi)=>`
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <select style="width:64px;padding:7px;font-size:13px;font-weight:700;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)"
        onchange="updYard2('${id}',${yi},'fid',this.value)">
        <option value="">F</option>
        ${numSort(outFinishers.map(f=>hById(f.hive_id))).map(f=>`<option value="${f.id}" ${y.fid===f.id?'selected':''}>${hiveLabel(f)}</option>`).join('')}
      </select>
      <input type="number" min="0" placeholder="cells" value="${y.cells||''}"
        style="width:64px;padding:7px;text-align:center;font-size:14px;font-weight:800;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)"
        onchange="updYard2('${id}',${yi},'cells',+this.value)">
      <input type="text" placeholder="yard name" value="${y.yard||''}"
        style="flex:1;padding:7px 10px;font-size:14px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)"
        onchange="updYard2('${id}',${yi},'yard',this.value)">
      <button class="btn bd bx" onclick="remYard2('${id}',${yi})">x</button>
    </div>`).join('');

  const assignBlock = isCloakeRec ? '' : (()=>{
    const allAllocated = !noStarters && (g.starters||[]).every(s=>{
      const acc = s.cells_accepted!=null ? s.cells_accepted : 0;
      const sent = (g.finishers||[]).reduce((a,f)=>{const src=(f.sources||[]).find(x=>x.sid===s.hive_id);return a+(src?src.count:0);},0);
      return acc>0 && sent>=acc;
    });
    const allocChip = allAllocated ? '<span class="chip cok" style="margin-left:6px">All allocated</span>' : '';
    const innerContent = noStarters
      ? '<p class="tsm">No starters on this graft. <button class=\"btn bg bx\" onclick=\"startEdit(\'' + id + '\');closePanel()\">Edit to add starters</button></p>'
      : '<p class="tsm" style="margin-bottom:10px">Enter cells from each starter and select a finisher.</p>'
        + assignRows
        + '<button class="btn bp bb mt8" onclick=\"saveAssign(\'' + id + '\')\">Save assignments</button>'
        + '<div class="dvd"></div>'
        + '<div class="lbl">Add extra cells to a finisher</div>'
        + '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        + '<select id="ef" style="flex:1;min-width:120px;padding:8px;font-size:14px;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)">'
        + '<option value="">Select F...</option>'
        + sortedFinishersByAvail(id).map(f=>{const av=finisherAvailable(f.id,id);const sum=finisherAllocSummary(f.id,id);return '<option value="'+f.id+'" style="'+(av?'':'color:#b0b0b0')+'">'+(av?'✓ ':'⊘ ')+hiveLabel(f)+(sum?' — '+sum:av?' available':' growing')+'</option>';}).join('')
        + '</select>'
        + '<input type="number" id="ec" min="0" placeholder="cells" style="width:80px;padding:8px;text-align:center;font-size:16px;font-weight:800;border:1.5px solid var(--bdr);border-radius:var(--rs);background:var(--wht)">'
        + '<button class="btn bp bs" onclick=\"saveExtra(\'' + id + '\')\">Add</button>'
        + '</div>';
    return '<div class="card" style="border:2px solid var(--g);padding:0;overflow:hidden">'
      + '<div style="display:flex;align-items:center;gap:8px;padding:18px;cursor:pointer" onclick=\"this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'none\'?\'block\':\'none\';this.querySelector(\'.chev\').textContent=this.nextElementSibling.style.display===\'none\'?\'›\':\'⌄\'\">'
      + '<span style="font-size:15px;font-weight:700;color:var(--g)">Assign cells to finishers</span>'
      + allocChip
      + '<span class="chev" style="margin-left:auto;color:var(--g);font-size:18px">›</span>'
      + '</div>'
      + '<div style="display:none;padding:0 18px 18px">' + innerContent + '</div>'
      + '</div>';
  })();

  document.getElementById('pbody').innerHTML=`
    <div class="card">
      <div class="chd">Summary</div>
      ${(()=>{
        const isCloake=g.method==='cloake';
        const fr=(g.finishers||[])[0];
        const finIdx=0;
        const inpSt='width:100%;border:none;background:transparent;text-align:center;font-size:22px;font-weight:800;outline:none;line-height:1;padding:0;-moz-appearance:textfield;';
        if(isCloake){
          const grVal=g.grafted||0;
          const inVal=fr?.cells_received||0;
          const capVal=fr?.capped||0;
          const outVal=fr?.out||0;
          const gid=g.id;
          return`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px">
            <div class="stat"><div class="n"><input type="number" min="0" style="${inpSt}color:var(--g)" value="${grVal||''}" placeholder="--" onchange="updGraftFlag('${gid}','grafted',+this.value||0);renderRecPanel('${gid}')"></div><div class="l">Grafted</div></div>
            <div class="stat" style="${inVal>0?'background:#dbeafe;border-radius:var(--rs)':''}"><div class="n" style="${inVal>0?'color:#1e40af':''}"><input type="number" min="0" style="${inpSt}color:${inVal>0?'#1e40af':'inherit'}" value="${inVal||''}" placeholder="--" onchange="updFin('${gid}',${finIdx},'cells_received',+this.value||0);renderRecPanel('${gid}')"></div><div class="l">Started</div></div>
            <div class="stat" style="${capVal>0?'background:#fef3c7;border-radius:var(--rs)':''}"><div class="n" style="${capVal>0?'color:#92400e':''}"><input type="number" min="0" style="${inpSt}color:${capVal>0?'#92400e':'inherit'}" value="${capVal||''}" placeholder="--" onchange="updFin('${gid}',${finIdx},'capped',+this.value||0);renderRecPanel('${gid}')"></div><div class="l">Capped</div></div>
            <div class="stat" style="${outVal>0?'background:var(--gl);border-radius:var(--rs)':''}"><div class="n" style="${outVal>0?'color:var(--g)':''}"><input type="number" min="0" style="${inpSt}color:${outVal>0?'var(--g)':'inherit'}" value="${outVal||''}" placeholder="--" onchange="updFin('${gid}',${finIdx},'out',+this.value||0);renderRecPanel('${gid}')"></div><div class="l">Out</div></div>
          </div>
          <div style="font-size:10px;color:var(--b3);text-align:center;margin-bottom:8px">Tap a number to edit</div>`;
        } else {
          const starters=g.starters||[];
          const gid=g.id;
          const grVal=tGr||0;
          const grInput=starters.length===1
            ?`<input type="number" min="0" style="${inpSt}color:var(--g)" value="${starters[0].cells_in||''}" placeholder="--" onchange="(function(v){const g=gById('${gid}');if(g&&g.starters&&g.starters[0]){g.starters[0].cells_in=v;stamp(g);save();renderRecPanel('${gid}');}})((+this.value)||0)">`
            :starters.length===0
              ?`<input type="number" min="0" style="${inpSt}color:var(--g)" value="${g.grafted||''}" placeholder="--" onchange="updGraftFlag('${gid}','grafted',+this.value||0);renderRecPanel('${gid}')">`
              :`<span>${grVal||'--'}</span>`;
          const multiF=(g.finishers||[]).length>1;
          const singleF=(g.finishers||[]).length===1;
          const sf=(g.finishers||[])[0];
          const sfIdx=0;
          const sfId=g.id;
          const inInput=singleF
            ?`<input type="number" min="0" style="${inpSt}color:${tIn>0?'#1e40af':'inherit'}" value="${sf?.cells_received||''}" placeholder="--" onchange="updFin('${sfId}',${sfIdx},'cells_received',+this.value||0);renderRecPanel('${sfId}')">`
            :`${tIn||'--'}`;
          const capInput=singleF
            ?`<input type="number" min="0" style="${inpSt}color:${tCapped>0?'#92400e':'inherit'}" value="${sf?.capped||''}" placeholder="--" onchange="updFin('${sfId}',${sfIdx},'capped',+this.value||0);renderRecPanel('${sfId}')">`
            :`${tCapped||'--'}`;
          const outInput=singleF
            ?`<input type="number" min="0" style="${inpSt}color:${tOut>0?'var(--g)':'inherit'}" value="${sf?.out||''}" placeholder="--" onchange="updFin('${sfId}',${sfIdx},'out',+this.value||0);renderRecPanel('${sfId}')">`
            :`${tOut||'--'}`;
          return`<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px">
            <div class="stat"><div class="n" style="color:var(--g)">${grInput}</div><div class="l">Grafted</div></div>
            <div class="stat" style="${tIn>0?'background:#dbeafe;border-radius:var(--rs)':''}"><div class="n" style="${tIn>0?'color:#1e40af':''}">${inInput}</div><div class="l">Started</div></div>
            <div class="stat" style="${tCapped>0?'background:#fef3c7;border-radius:var(--rs)':''}"><div class="n" style="${tCapped>0?'color:#92400e':''}">${capInput}</div><div class="l">Capped</div></div>
            <div class="stat" style="${tOut>0?'background:var(--gl);border-radius:var(--rs)':''}"><div class="n" style="${tOut>0?'color:var(--g)':''}">${outInput}</div><div class="l">Out</div></div>
          </div>
          <div style="font-size:10px;color:var(--b3);text-align:center;margin-bottom:8px">${multiF?'Started / Capped / Out — edit per finisher below ↓':'Tap a number to edit'}</div>`;
        }
      })()}
      ${gp!==null?`<div class="lbl">Out / grafted</div>${pctBar(gp)}`:''}
    </div>
    ${(g.starters||[]).length?`<div class="card"><div class="chd">Starters</div>${stSummary}</div>`:''}
    ${assignBlock}
    <div class="card" style="padding:0;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;padding:18px;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none';this.querySelector('.chev').textContent=this.nextElementSibling.style.display==='none'?'›':'⌄'">
        <span style="font-size:15px;font-weight:700">Finisher Records</span>
        <span class="txs ml">${tGr} grafted · ${tIn} assigned</span>
        <span class="chev" style="color:var(--b3);font-size:18px">⌄</span>
      </div>
      <div style="padding:0 18px 18px">
        ${(g.finishers||[]).length?finRows:'<p class="tsm">No finishers assigned yet.</p>'}
      </div>
    </div>
    <div class="card">
      <div class="chd">Yard Allocation <span class="txs ml">where did the cells go?</span></div>
      ${outFinishers.length?`
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:12px;padding:10px 12px;background:var(--gl);border-radius:var(--rs)">
          <div><div style="font-size:22px;font-weight:800;color:var(--g);line-height:1">${totalOutCells}</div><div class="txs">cells out</div></div>
          <div style="color:var(--b3);font-size:18px">→</div>
          <div><div style="font-size:22px;font-weight:800;color:${yardLeftGraft>0?'var(--amb)':'var(--g)'};line-height:1">${totalYardAllocated}</div><div class="txs">allocated</div></div>
          <div style="margin-left:auto;text-align:right">
            <div style="font-size:13px;font-weight:700;color:${yardLeftGraft>0?'var(--amb)':'var(--g)'}">${yardLeftGraft>0?yardLeftGraft+' left':'all allocated'}</div>
          </div>
        </div>
        <p class="tsm" style="margin-bottom:10px">Pick a finisher, enter cells, and type a yard name.</p>
        ${yardRows}
        <button class="btn badd bx" style="width:100%" onclick="addYard2('${id}')">+ Add yard allocation</button>`
        :`<p class="tsm" style="color:var(--b3)">No finishers due out yet. This section unlocks once a finisher's out date arrives or you mark cells as out.</p>`}
    </div>`;
}

function saveAssign(gid){
  const g=gById(gid);if(!g)return;
  const d=dayjs(g.date);
  const estCap=d.add(5,'day').format('YYYY-MM-DD');const estOut=d.add(10,'day').format('YYYY-MM-DD');
  let any=false;
  (g.starters||[]).forEach(s=>{
    const accepted=assignDraft[s.hive_id+'_accepted'];
    if(accepted!=null&&accepted!=='')s.cells_accepted=+accepted;

    // First, remove this starter's existing contribution from all finishers
    // (we're about to rebuild it from the current draft rows)
    (g.finishers||[]).forEach(f=>{
      if(!f.sources)return;
      const exS=f.sources.find(x=>x.sid===s.hive_id);
      if(exS){ f.cells_received=Math.max(0,(f.cells_received||0)-exS.count); f.sources=f.sources.filter(x=>x.sid!==s.hive_id); }
    });

    // Now re-add from the current draft rows
    const rows=assignDraft[s.hive_id]||[];
    rows.forEach(row=>{
      const cells=+row.cells;const finId=row.fin;
      if(!cells||!finId)return;
      const ex=(g.finishers||[]).find(f=>f.hive_id===finId);
      if(ex){ex.cells_received=(ex.cells_received||0)+cells;if(!ex.sources)ex.sources=[];ex.sources.push({sid:s.hive_id,count:cells});}
      else{if(!g.finishers)g.finishers=[];g.finishers.push({hive_id:finId,cells_received:cells,sources:[{sid:s.hive_id,count:cells}],capped:null,out:null,mated:null,capped_date:estCap,out_date:estOut});}
      any=true;
      row.saved=true;
    });
    if(accepted!=null&&accepted!=='')any=true;
  });
  // Drop any finisher records that ended up with zero cells (e.g. row was cleared to blank)
  g.finishers=(g.finishers||[]).filter(f=>(f.cells_received||0)>0);
  if(!any){toast('Enter accepted cells or assign to a finisher');return;}
  stamp(g);save();toast('Saved');assignDraft={};renderRecPanel(gid);
}
